{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آفلاین | آکوآدار</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.10);
            max-width: 400px;
            width: 100%;
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 22px; font-weight: bold; color: #1a1a2e; margin-bottom: 12px; }
        p { font-size: 14px; color: #666; line-height: 1.7; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            background: #27ae60;
            color: #fff;
            padding: 10px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .brand { font-size: 12px; color: #aaa; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📶</div>
        <h1>شما آفلاین هستید</h1>
        <p>اتصال اینترنت شما قطع شده است. لطفاً اتصال خود را بررسی کنید و دوباره تلاش کنید.</p>
        <a href="/" class="btn" onclick="location.reload(); return false;">تلاش مجدد</a>
        <div class="brand">آکوآدار — سیستم مدیریت آبیاری</div>
    </div>
</body>
</html>
