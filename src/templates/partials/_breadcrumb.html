{% load i18n %}

{% if breadcrumbs %}
<nav aria-label="breadcrumb" class="aq-breadcrumb-wrap">
    <ol class="aq-breadcrumb">
        <li><a href="{% url 'public:index' %}"><i class="fa fa-home"></i> {% trans "Dashboard" %}</a></li>
        {% for crumb in breadcrumbs %}
            <li class="aq-bc-sep" aria-hidden="true">/</li>
            {% if crumb.url and not forloop.last %}
                <li><a href="{{ crumb.url }}">{{ crumb.name }}</a></li>
            {% else %}
                <li class="aq-bc-active" aria-current="page">{{ crumb.name }}</li>
            {% endif %}
        {% endfor %}
    </ol>
</nav>

<style>
.aq-breadcrumb-wrap { max-width: 1400px; margin: 0 auto; padding: 12px 16px 0; }
.aq-breadcrumb {
    list-style: none; margin: 0; padding: 8px 14px;
    background: #fff; border: 1px solid #eef1f7; border-radius: 10px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    font-size: 13px; color: #5a6c84;
}
.aq-breadcrumb li { display: inline-flex; align-items: center; }
.aq-breadcrumb a { color: #1a73e8; text-decoration: none; }
.aq-breadcrumb a:hover { text-decoration: underline; }
.aq-bc-sep { color: #c9d1de; }
.aq-bc-active { color: #1a1a2e; font-weight: 600; }
</style>
{% endif %}
