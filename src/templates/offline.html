<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آفلاین</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f6f9; font-family: Tahoma, sans-serif; color: #334155; text-align: center; }
        .box { background: #fff; border-radius: 16px; padding: 36px 28px; max-width: 360px; box-shadow: 0 2px 14px rgba(0,0,0,.08); }
        img { width: 84px; height: 84px; }
        h1 { font-size: 18px; margin: 16px 0 8px; }
        p { font-size: 14px; color: #64748b; margin: 0 0 20px; }
        button { background: #27ae60; color: #fff; border: none; border-radius: 8px; padding: 10px 28px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
<div class="box">
    <img src="/static/img/logo.png" alt="">
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>لطفاً اتصال خود را بررسی کنید و دوباره تلاش کنید.</p>
    <button type="button" onclick="location.href='/'">تلاش مجدد</button>
</div>
</body>
</html>
